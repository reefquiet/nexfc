<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexfy Kumanda Seçimi</title>
    <style>
        :root {
            --bg: #0D0D0D;
            --card: #1A1A1A;
            --accent: #BB86FC;
            --text: #FFFFFF;
        }
        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 320px;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 30px;
            letter-spacing: 1px;
            font-weight: 800;
        }
        .choice-btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            background: var(--card);
            border: 2px solid #333;
            border-radius: 16px;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s;
            box-sizing: border-box;
        }
        .choice-btn:active {
            transform: scale(0.95);
            border-color: var(--accent);
            background: #252525;
        }
        .choice-btn span {
            display: block;
            font-size: 13px;
            color: #AAA;
            font-weight: normal;
            margin-top: 4px;
        }
        .accent-border {
            border-color: var(--accent);
        }
        .logo {
            font-size: 40px;
            color: var(--accent);
            margin-bottom: 10px;
            font-weight: 900;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">NX</div>
        <h1>Nexfy Kumanda</h1>
        <p style="color: #888; margin-bottom: 40px;">Cihazınıza uygun olan kumanda yöntemini seçin</p>

        <a href="#" id="btnAndroid" class="choice-btn accent-border">
            Android için
            <span>APK olarak indir ve kur</span>
        </a>

        <a href="#" id="btnIphone" class="choice-btn">
            Iphone için
            <span>Web üzerinden hemen kullan</span>
        </a>
    </div>

    <script>
        // Smart TV IP Detection
        function getTvIp() {
            const hashIp = window.location.hash.substring(1);
            const hostIp = window.location.hostname;
            const invalidHosts = ['reefquiet.github.io', 'localhost', '127.0.0.1'];

            // Priority 1: URL Hash (#192.168.x.x)
            if (hashIp && !invalidHosts.includes(hashIp)) return hashIp;

            // Priority 2: Hostname (If served from TV directly)
            if (hostIp && !invalidHosts.includes(hostIp)) return hostIp;

            // Priority 3: Local Storage
            return localStorage.getItem('last_ip') || "";
        }

        const tvIp = getTvIp();

        // Android APK link (Update with your actual link)
        document.getElementById('btnAndroid').href = "http://reefquiet.github.io/nexfc/nexfy_remote.apk";

        // Iphone Web Remote link
        // Pass the IP to the next page via hash
        document.getElementById('btnIphone').href = "https://reefquiet.github.io/nexfc/#" + tvIp;
    </script>
</body>
</html>
