<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <title>Nexfy Remote</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --accent: #bb86fc;
      --mor-border: rgba(153, 101, 244, 0.6);
      --text: #ffffff;
      --btn-size: 60px;
    }
    html, body { height: 100%; margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: sans-serif; overflow: hidden; }
    body { display: flex; flex-direction: column; align-items: center; padding: 0 16px; box-sizing: border-box; user-select: none; touch-action: none; }

    /* Header - Moved to Very Top */
    .header {
        width: 100%; padding: 12px 0; display: flex; justify-content: space-between; align-items: center;
        background: transparent; box-sizing: border-box;
    }
    .status-container { display: flex; align-items: center; gap: 10px; }
    .antenna-icon { width: 32px; height: 32px; transition: fill 0.3s; }
    .status-text { font-size: 11px; font-weight: bold; transition: opacity 0.5s; pointer-events: none; }
    .status-online { fill: #44ff44 !important; }
    .status-offline { fill: #ff4444 !important; }
    .qr-btn { color: white; cursor: pointer; font-size: 28px; }

    /* Input - Tight with Header */
    .input-section { width: 100%; max-width: 450px; margin-bottom: 8px; }
    .input-box { display: flex; background: #1a1a1a; border-radius: 28px; padding: 2px 16px; align-items: center; border: 1px solid #333; }
    input { flex: 1; background: transparent; border: none; color: white; padding: 12px; font-size: 14px; outline: none; }

    /* Volume - Tight with Input */
    .btn-row { width: 100%; display: flex; justify-content: center; gap: 20px; margin: 8px 0; }
    .btn-circle {
      width: var(--btn-size); height: var(--btn-size);
      background: var(--card); border-radius: 50%; border: 1px solid #333;
      display: flex; align-items: center; justify-content: center;
      color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      transition: transform 0.1s;
    }
    .btn-circle:active { transform: scale(0.92); background: #252525; }
    .btn-youtube { background: #FF0000 !important; border: none; overflow: hidden; }
    .btn-youtube img { width: 100%; height: 100%; object-fit: cover; padding: 12px; }

    .btn-nexai { width: var(--btn-size); height: var(--btn-size); background: transparent; border: none; overflow: visible; display: flex; align-items: center; justify-content: center; }
    .btn-nexai.active { background: rgba(187, 134, 252, 0.2); border-radius: 50%; }

    /* TOUCHPAD AREA - BİGGER SIZE */
    #touchpad {
      width: 100%; max-width: 480px; flex: 1.5;
      background: #141414; border: 1px solid #252525; border-radius: 32px;
      margin: 8px 0; display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden; transition: background 0.3s;
      min-height: 120px;
    }
    #touchpad.dragging { background: #1a1a1a; border-color: var(--accent); }
    #touchpad::after {
        content: var(--tp-text, "TOUCHPAD"); color: rgba(255,255,255,0.05);
        font-weight: 900; letter-spacing: 8px; font-size: 24px;
    }

    /* D-Pad Section */
    .remote-container { position: relative; width: 240px; height: 240px; margin: 16px 0; flex-shrink: 0; }
    .dpad-bg {
      width: 100%; height: 100%;
      background: #121212;
      background-image:
        linear-gradient(45deg, transparent 49.5%, #000 49.5%, #000 50.5%, transparent 50.5%),
        linear-gradient(-45deg, transparent 49.5%, #000 49.5%, #000 50.5%, transparent 50.5%);
      border-radius: 50%; border: 3px solid var(--mor-border);
      box-shadow: 0 10px 20px rgba(0,0,0,0.6);
    }
    .remote-btn {
        position: absolute; font-size: 48px !important; color: rgba(255,255,255,0.7);
        text-decoration: none; display: flex; align-items: center; justify-content: center;
        width: 80px; height: 80px; z-index: 5; transition: transform 0.1s;
    }
    .remote-btn:active { transform: scale(0.85); color: #9965F4; }
    .up { top: 0; left: 80px; }
    .down { bottom: 0; left: 80px; }
    .left { left: 0; top: 80px; }
    .right { right: 0; top: 80px; }

    .enter {
        position: absolute;
        top: 77.5px; left: 77.5px; width: 85px; height: 85px;
        background: linear-gradient(180deg, #BB86FC 0%, #6200ee 100%);
        border-radius: 50%; color: white; font-size: 20px !important; font-weight: 800;
        border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 10;
        display: flex; align-items: center; justify-content: center; transition: transform 0.1s;
        text-decoration: none;
    }
    .enter:active { transform: scale(0.92); }

    /* Bottom Rows */
    .nav-row { width: 100%; max-width: 400px; display: flex; justify-content: space-between; margin: 12px 0; }
    .shortcut-row { width: 100%; max-width: 450px; display: flex; justify-content: space-around; margin-bottom: 24px; align-items: center; }

    /* Animations */
    .eye { transition: transform 0.1s; transform-origin: center 13px; }
    .blink { animation: blink-anim 0.3s ease-in-out forwards; }
    @keyframes blink-anim {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(0.1); }
    }
    .mic-active-glow { animation: pulse-purple 1.5s infinite; }
    @keyframes pulse-purple { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

    footer { width: 100%; padding: 12px 0; background: rgba(0,0,0,0.3); border-top: 1px solid #333; margin-top: auto; }
    footer ul { display: flex; justify-content: space-around; list-style: none; padding: 0; margin: 0; }
    footer li a { color: white; font-size: 30px; }

    #errorOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    .auth-btn { background: #ff4444; color: white; border: none; padding: 15px 30px; border-radius: 25px; font-weight: bold; font-size: 18px; margin-top: 20px; }
  </style>
</head>
<body oncontextmenu="return false;">
  <div id="errorOverlay">
    <span class="material-icons" style="font-size: 80px; color: #ff4444;">gpp_maybe</span>
    <h2 id="errTitle">CONNECTION ERROR</h2>
    <p id="errDesc">You need to authorize secure connection for microphone to work.</p>
    <button class="auth-btn" id="btnAuth" onclick="authorize()">AUTHORIZE TV</button>
  </div>

  <!-- Row: Status & Refresh -->
  <div class="header">
    <div class="status-container">
        <svg id="antennaIcon" class="antenna-icon status-offline" viewBox="0 0 24 24">
            <path d="M2,22 L10,22 L8,17 L4,17 Z" fill="currentColor" />
            <circle cx="6" cy="17" r="1.5" fill="currentColor" />
            <path d="M11,11 C10,9.5 8.5,9 6.5,9.5 C5.5,10 4.5,11 4.5,12.5 C4.5,14 5.5,15.5 7,17 L6,17 L11,11 Z" fill="currentColor" />
            <circle cx="10" cy="12" r="1" fill="currentColor" />
            <path d="M14,10 C15,11 16,12.5 16.5,14.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            <path d="M16.5,7.5 C18.5,9 20,11.5 20.5,14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            <path d="M19,5 C22,7 24,10.5 24.5,14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <span id="statusText" class="status-text" style="color: #ff4444;">Disconnected</span>
    </div>
    <span id="mainTitle" style="font-weight: bold; font-size: 14px; letter-spacing: 1px;">NEXFY REMOTE</span>
    <span class="material-icons qr-btn" onclick="location.reload()">refresh</span>
  </div>

  <!-- Row: Text Input -->
  <div class="input-section">
    <div class="input-box">
      <input type="text" id="textInput" placeholder="Type to TV...">
      <span class="material-icons" style="color: var(--accent); cursor: pointer;" onclick="sendText()">send</span>
    </div>
  </div>

  <!-- Row: Volume -->
  <div class="btn-row">
    <div class="btn-circle" onclick="send('VOL-')"><span class="material-icons">volume_down</span></div>
    <div class="btn-circle" onclick="send('MUTE')"><span class="material-icons">volume_off</span></div>
    <div class="btn-circle" onclick="send('VOL+')"><span class="material-icons">volume_up</span></div>
  </div>

  <!-- Row: TOUCHPAD (Flexible/Larger) -->
  <div id="touchpad"></div>

  <!-- Row: D-Pad -->
  <div class="remote-container">
    <div class="dpad-bg"></div>
    <a class="material-icons remote-btn up" href="javascript:send('UP');">keyboard_arrow_up</a>
    <a class="material-icons remote-btn left" href="javascript:send('LEFT');">keyboard_arrow_left</a>
    <a class="enter" id="okBtn" href="javascript:void(0);">OK</a>
    <a class="material-icons remote-btn right" href="javascript:send('RIGHT');">keyboard_arrow_right</a>
    <a class="material-icons remote-btn down" href="javascript:send('DOWN');">keyboard_arrow_down</a>
  </div>

  <!-- Row: Navigation -->
  <div class="nav-row">
    <div class="btn-circle" onclick="send('BACK')"><span class="material-icons">arrow_back</span></div>
    <div class="btn-circle" onclick="send('HOME')"><span class="material-icons">home</span></div>
    <div class="btn-circle" onclick="send('LAUNCHER_SETTINGS')"><span class="material-icons">menu</span></div>
  </div>

  <!-- Row: Shortcuts -->
  <div class="shortcut-row">
    <div class="btn-circle btn-youtube" onclick="launch('com.google.android.youtube.tv')">
        <img src="https://www.gstatic.com/youtube/img/branding/favicon/favicon_144x144.png" alt="YT">
    </div>
    <div class="btn-circle btn-nexai" id="nexAiBtn" onclick="toggleVoice('NEXAI_CMD')">
        <svg id="robotHead" viewBox="0 0 24 24" width="60" height="60">
            <path d="M12,2C7.5,2 4,6 4,11.5C4,17 8,22 12,22C16,22 20,17 20,11.5C20,6 16.5,2 12,2Z" fill="#1A1A1A" stroke="#9965F4" stroke-width="0.5" />
            <path d="M12,4C9,4 6.5,6.5 6,9C7.5,8 10,7.5 12,7.5C14,7.5 16.5,8 18,9C17.5,6.5 15,4 12,4Z" fill="#BB86FC" fill-opacity="0.8" />
            <path d="M12,6C10,6 8.5,7 8,8C9,7.5 10.5,7.2 12,7.2C13.5,7.2 15,7.5 16,8C15.5,7 14,6 12,6Z" fill="#E1BEE7" fill-opacity="0.6" />
            <circle id="eyeL" class="eye" cx="8.5" cy="13" r="1.5" fill="#FFFFFF" />
            <circle id="eyeR" class="eye" cx="15.5" cy="13" r="1.5" fill="#FFFFFF" />
        </svg>
    </div>
    <div class="btn-circle" onclick="send('SYSTEM_SETTINGS')">
        <span class="material-icons">apps</span>
    </div>
  </div>

  <iframe id="fallbackFrame" style="display:none;"></iframe>

  <script>
    let ws;
    let targetIp = '';
    const antennaIcon = document.getElementById('antennaIcon');
    const statusText = document.getElementById('statusText');
    const nexAiBtn = document.getElementById('nexAiBtn');
    const errorOverlay = document.getElementById('errorOverlay');
    const fallbackFrame = document.getElementById('fallbackFrame');
    const touchpad = document.getElementById('touchpad');
    const okBtn = document.getElementById('okBtn');
    const eyeL = document.getElementById('eyeL');
    const eyeR = document.getElementById('eyeR');

    // i18n
    const lang = navigator.language.startsWith('tr') ? 'tr' : 'en';
    const i18n = {
        tr: { input: "TV'ye yaz...", tp: "TOUCHPAD", conn: "Bağlandı", disc: "Bağlantı Kesildi" },
        en: { input: "Type to TV...", tp: "TOUCHPAD", conn: "Connected", disc: "Disconnected" }
    };

    function applyLang() {
        const t = i18n[lang];
        document.getElementById('textInput').placeholder = t.input;
        touchpad.style.setProperty('--tp-text', `"${t.tp}"`);
    }

    function updateStatus(connected) {
        const t = i18n[lang];
        if (connected) {
            antennaIcon.classList.remove('status-offline');
            antennaIcon.classList.add('status-online');
            statusText.textContent = t.conn;
            statusText.style.color = "#44ff44";
            statusText.style.opacity = "1";
            setTimeout(() => { if (ws && ws.readyState === WebSocket.OPEN) statusText.style.opacity = "0"; }, 3000);
        } else {
            antennaIcon.classList.remove('status-online');
            antennaIcon.classList.add('status-offline');
            statusText.textContent = t.disc;
            statusText.style.color = "#ff4444";
            statusText.style.opacity = "1";
        }
    }

    function init() {
      applyLang();
      const urlParams = new URLSearchParams(window.location.search);
      const hashIp = window.location.hash.substring(1);
      const invalidHosts = ['reefquiet.github.io', 'localhost', '127.0.0.1'];

      // Smart IP Detection with strict filtering
      let foundIp = "";

      if (hashIp && !invalidHosts.includes(hashIp)) {
          foundIp = hashIp;
      } else if (urlParams.get('ip')) {
          foundIp = urlParams.get('ip');
      } else if (!invalidHosts.includes(window.location.hostname)) {
          foundIp = window.location.hostname;
      }

      if (!foundIp) {
          foundIp = localStorage.getItem('last_ip');
      }

      if (foundIp && !invalidHosts.includes(foundIp)) {
        targetIp = foundIp;
        localStorage.setItem('last_ip', targetIp);
        connect();
      } else {
        statusText.textContent = "IP Required (#192.168.x.x)";
        statusText.style.opacity = "1";
      }
      setupTouchpad();
      setupLongPress();
      startBlinkCycle();
    }

    function connect() {
      // Determine protocol and port based on how the page is loaded
      const isHttps = window.location.protocol === 'https:';
      const protocol = isHttps ? 'wss' : 'ws';
      const port = isHttps ? '8888' : '8889';

      console.log(`Connecting to ${protocol}://${targetIp}:${port}/ws`);
      ws = new WebSocket(`${protocol}://${targetIp}:${port}/ws`);

      ws.onopen = () => {
          updateStatus(true);
          errorOverlay.style.display = 'none';
      };

      ws.onerror = () => {
          updateStatus(false);
          if (isHttps) {
              // On HTTPS, if WSS fails, it's almost always a certificate issue
              errorOverlay.style.display = 'flex';
          }
      };
      ws.onmessage = (event) => {
          try {
              const data = JSON.parse(event.data);
              if (data.command === 'TRIGGER_MIC') {
                  toggleVoice('NEXAI_CMD');
              }
          } catch (e) {}
      };
      ws.onclose = () => { updateStatus(false); };
    }

    function send(cmd, text = null) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ command: cmd, text: text }));
      } else if (cmd !== 'MOUSE_MOVE' && cmd !== 'MOUSE_CLICK' && !cmd.startsWith('DRAG')) {
        let url = `http://${targetIp}:8889/controller?action=keyevent&keycode=${cmd.toLowerCase()}`;
        if (cmd === 'NEXAI_CMD') url = `http://${targetIp}:8889/controller?action=nexai&text=${encodeURIComponent(text)}`;
        fallbackFrame.src = url;
      }
      if (window.navigator.vibrate) window.navigator.vibrate(30);
    }

    function startBlinkCycle() {
        setInterval(() => {
            eyeL.classList.add('blink');
            eyeR.classList.add('blink');
            setTimeout(() => {
                eyeL.classList.remove('blink');
                eyeR.classList.remove('blink');
                setTimeout(() => {
                    eyeL.classList.add('blink');
                    eyeR.classList.add('blink');
                    setTimeout(() => {
                        eyeL.classList.remove('blink');
                        eyeR.classList.remove('blink');
                    }, 150);
                }, 100);
            }, 150);
        }, 10000);
    }

    function setupLongPress() {
        let pressTimer;
        let startT;
        okBtn.addEventListener('touchstart', (e) => {
            startT = Date.now();
            pressTimer = window.setTimeout(() => {
                send('SELECT_LONG');
                if (window.navigator.vibrate) window.navigator.vibrate([50, 30, 50]);
                pressTimer = null;
            }, 800);
        });
        okBtn.addEventListener('touchend', (e) => {
            if (pressTimer) {
                clearTimeout(pressTimer);
                if (Date.now() - startT < 800) {
                    send('SELECT');
                }
            }
        });
    }

    function sendText() {
      const input = document.getElementById('textInput');
      if (input.value) { send('TEXT', input.value); input.value = ''; }
    }

    function launch(pkg) {
      if (ws && ws.readyState === WebSocket.OPEN) { send('LAUNCH', pkg); }
      else { fallbackFrame.src = `http://${targetIp}:8889/controller?action=startapp&packagename=${pkg}`; }
    }

    function authorize() { window.open(`https://${targetIp}:8888/test`, '_blank'); }

    // Touchpad Logic
    let lastClickT = 0;
    let clickTimeout = null;

    function setupTouchpad() {
        let lastX = 0, lastY = 0;
        let totalDist = 0;
        let touchStartT = 0;
        let dragTimer;
        let isDragging = false;

        touchpad.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            lastX = touch.clientX;
            lastY = touch.clientY;
            totalDist = 0;
            touchStartT = Date.now();
            isDragging = false;

            dragTimer = setTimeout(() => {
                isDragging = true;
                touchpad.classList.add('dragging');
                send('DRAG_START');
            }, 800);
        }, { passive: true });

        touchpad.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            const dx = touch.clientX - lastX;
            const dy = touch.clientY - lastY;
            totalDist += Math.sqrt(dx*dx + dy*dy);

            if (Math.abs(dx) > 0.1 || Math.abs(dy) > 0.1) {
                if (isDragging) {
                    send('DRAG_MOVE', `${dx.toFixed(1)},${dy.toFixed(1)}`);
                } else {
                    send('MOUSE_MOVE', `${dx.toFixed(1)},${dy.toFixed(1)}`);
                    if (totalDist > 15) clearTimeout(dragTimer);
                }
            }
            lastX = touch.clientX;
            lastY = touch.clientY;
        }, { passive: true });

        touchpad.addEventListener('touchend', (e) => {
            clearTimeout(dragTimer);
            const now = Date.now();
            if (isDragging) {
                send('DRAG_END');
                touchpad.classList.remove('dragging');
            } else {
                const duration = now - touchStartT;
                if (totalDist < 25 && duration < 400) {
                    const gap = now - lastClickT;
                    if (gap > 40 && gap < 500) {
                        if (clickTimeout) { clearTimeout(clickTimeout); clickTimeout = null; }
                        lastClickT = 0;
                        send('SELECT_LONG');
                    } else {
                        lastClickT = now;
                        if (clickTimeout) clearTimeout(clickTimeout);
                        clickTimeout = setTimeout(() => {
                            send('MOUSE_CLICK');
                            clickTimeout = null;
                        }, 450);
                    }
                }
            }
        }, { passive: true });
    }

    // Voice Improvement
    let recognition;
    let activeMode = 'TEXT';

    function initVoice() {
        if (!recognition && 'webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = false;
            recognition.lang = lang === 'tr' ? 'tr-TR' : 'en-US';

            recognition.onstart = () => { nexAiBtn.classList.add('mic-active-glow'); nexAiBtn.classList.add('active'); };
            recognition.onend = () => { nexAiBtn.classList.remove('mic-active-glow'); nexAiBtn.classList.remove('active'); };

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                if (activeMode === 'NEXAI_CMD') send('NEXAI_CMD', text);
                else { document.getElementById('textInput').value = text; sendText(); }
            };

            recognition.onerror = (e) => {
                nexAiBtn.classList.remove('mic-active-glow');
                nexAiBtn.classList.remove('active');
                if (e.error === 'not-allowed') send('OPEN_TV_MIC');
            };
        }
    }

    function toggleVoice(mode) {
        initVoice();
        if (!recognition) return alert("Speech recognition not supported.");

        activeMode = mode;
        if (mode === 'NEXAI_CMD' && ws && ws.readyState === WebSocket.OPEN) {
            send('NEXAI');
        }

        try {
            recognition.start();
        } catch (e) {
            recognition.stop();
            setTimeout(() => recognition.start(), 100);
        }
    }

    init();
  </script>
</body>
</html>
